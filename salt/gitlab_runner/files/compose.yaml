services:
  gitlab-runner:
    image: gitlab/gitlab-runner:v17.5.1
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/gitlab-runner
      - ./certs:/etc/gitlab-runner/certs
