workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'

stages:
  - validate
  - deploy

.salt_ssh:
  image: docker:27-cli
  tags:
    - salt-deploy
  resource_group: gitlab-runners
  before_script:
    - chmod 600 "$SSH_PRIVATE_KEY"
    - |
      ssh_master() {
        ssh -T -i "$SSH_PRIVATE_KEY" \
          -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
          -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS" \
          -l "$SALT_MASTER_USER" -- "$SALT_MASTER_HOST" "$@"
      }

validate:
  extends: .salt_ssh
  stage: validate
  script:
    - ssh_master "salt-run fileserver.update && salt --out=highstate --state-output=terse 'runner-minon*' state.apply saltenv=base test=True"

deploy:
  extends: .salt_ssh
  stage: deploy
  script:
    - ssh_master "salt --out=highstate --state-output=terse 'runner-minon*' state.apply saltenv=base"
