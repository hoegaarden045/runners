workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'

stages:
  - validate
  - deploy

variables:
  SSH_OPTIONS: >-
    -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10
    -o StrictHostKeyChecking=yes

.salt_ssh:
  image: docker:27-cli
  tags:
    - salt-deploy
  resource_group: gitlab-runners
  before_script:
    - chmod 600 "$SSH_PRIVATE_KEY"

validate:
  extends: .salt_ssh
  stage: validate
  script:
    - >-
      ssh $SSH_OPTIONS -i "$SSH_PRIVATE_KEY"
      -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS"
      -l "$SALT_MASTER_USER" -- "$SALT_MASTER_HOST"
      "salt-run fileserver.update && salt --out=highstate --state-output=terse 'runner-minon*' state.apply saltenv=base test=True"

deploy:
  extends: .salt_ssh
  stage: deploy
  script:
    - >-
      ssh $SSH_OPTIONS -i "$SSH_PRIVATE_KEY"
      -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS"
      -l "$SALT_MASTER_USER" -- "$SALT_MASTER_HOST"
      "salt --out=highstate --state-output=terse 'runner-minon*' state.apply saltenv=base"
